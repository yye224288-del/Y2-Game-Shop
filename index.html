<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Y2 Game Shop</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#101d30;border:1px solid #29415e;border-radius:16px;padding:18px;margin:14px 0}.logo{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.title{text-align:center;font-size:28px;font-weight:800}.sub{text-align:center;color:#aabbd0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pkg{background:#172940;border:1px solid #315071;border-radius:12px;padding:14px;cursor:pointer}.pkg.selected{border-color:#4aa8ff}.price{color:#7dc8ff;margin-top:5px}label{display:block;margin:12px 0 6px;color:#c0cede}input,select,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #355170;background:#0b1728;color:#fff;font-size:15px}button{margin-top:15px;background:#1687ff;border:0;font-weight:700}.ok{color:#7ee2a4}.result{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><img class="logo" src="y2_logo.png" alt="Y2 Game Shop"><div class="title">Y2 Game Shop</div><div class="sub">MLBB Diamond Shop</div><div class="card"><h3>💎 Diamond Package</h3><div id="packages" class="grid"></div><label>Player ID</label><input id="player" placeholder="Player ID"><label>Server ID</label><input id="server" placeholder="Server ID"><label>Payment Method</label><select id="payment"><option>KBZPay — 09662222753</option><option>WavePay — 09662222753</option></select><p>💳 ငွေလွှဲရန်: <b>09662222753</b></p><button id="order">Order တင်မယ်</button><p id="msg"></p></div><div id="result" class="card result"></div></div><script>const packages=[{d:86,p:5600},{d:172,p:11000},{d:257,p:16500},{d:343,p:21200},{d:429,p:27000},{d:515,p:31800},{d:706,p:42000},{d:878,p:53000},{d:963,p:58000}];let selected=null;const box=document.getElementById('packages');packages.forEach((x,i)=>{const e=document.createElement('div');e.className='pkg';e.innerHTML='<b>💎 '+x.d+' Diamonds</b><div class="price">'+x.p.toLocaleString()+' Ks</div>';e.onclick=()=>{document.querySelectorAll('.pkg').forEach(a=>a.classList.remove('selected'));e.classList.add('selected');selected=x};box.appendChild(e)});document.getElementById('order').onclick=()=>{const player=document.getElementById('player').value.trim(),server=document.getElementById('server').value.trim(),payment=document.getElementById('payment').value,msg=document.getElementById('msg');if(!selected){msg.textContent='Diamond package ရွေးပါ။';return}if(!player||!server){msg.textContent='Player ID နဲ့ Server ID ထည့်ပါ။';return}const o={id:'Y2-'+Date.now().toString().slice(-8),diamonds:selected.d,price:selected.p,player,server,payment,status:'Pending',time:new Date().toLocaleString()};const a=JSON.parse(localStorage.getItem('y2_orders')||'[]');a.unshift(o);localStorage.setItem('y2_orders',JSON.stringify(a));document.getElementById('result').style.display='block';document.getElementById('result').innerHTML='<h3 class="ok">Order တင်ပြီးပါပြီ ✅</h3>Order ID: <b>'+o.id+'</b><br>💎 '+o.diamonds+' Diamonds — '+o.price.toLocaleString()+' Ks<br>Player ID: '+o.player+'<br>Server ID: '+o.server+'<br>Payment: '+o.payment+'<br>Status: Pending';msg.textContent='';};</script></body></html>
